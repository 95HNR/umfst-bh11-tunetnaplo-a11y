<!doctype html>
<html lang="hu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tünetnapló</title>
    <style>
        body {
            font: 15px system-ui, sans-serif;
            background: #fff;
            color: #222;
            max-width: 560px;
            margin: auto;
            padding: 16px;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        legend {
            font-size: 1.17em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .chk-label {
            display: inline-block;
            margin: 4px;
            cursor: pointer;
        }

        .chk-label input {
            position: absolute;
            opacity: 0;
        }

        .chk-text {
            display: inline-block;
            padding: 8px 12px;
            border: 1px solid #767676;
            border-radius: 16px;
        }

        .chk-label input:checked+.chk-text {
            background: #0e7c66;
            color: #fff;
        }

        .chk-label input:focus-visible+.chk-text {
            outline: 2px solid #222;
            outline-offset: 2px;
        }

        input[type="number"],
        textarea {
            display: block;
            width: 100%;
            padding: 8px;
            font: inherit;
            border: 1px solid #767676;
        }

        .hibas {
            border: 2px solid #e74c3c;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            background: #0e7c66;
            color: #fff;
            padding: 10px 16px;
            cursor: pointer;
        }

        #ok {
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Napi tünetnapló</h1>

    <fieldset>
        <legend>Tünetek</legend>
        <label class="chk-label">
            <input type="checkbox" name="tunet" value="fejfajas">
            <span class="chk-text">Fejfájás</span>
        </label>
        <label class="chk-label">
            <input type="checkbox" name="tunet" value="hanyinger">
            <span class="chk-text">Hányinger</span>
        </label>
        <label class="chk-label">
            <input type="checkbox" name="tunet" value="szedules">
            <span class="chk-text">Szédülés</span>
        </label>
    </fieldset>

    <h3>Erősség (0–10)</h3>
    <input id="eros" type="number" min="0" max="10" tabindex="2">
    <h3>Megjegyzés</h3>
    <textarea id="megj" tabindex="1"></textarea>
    <div class="btn" id="ment">Mentés</div>
    <p id="ok"></p>
    <script>
        document.getElementById('ment').addEventListener('click', function () {
            var eros = document.getElementById('eros');
            var v = Number(eros.value);
            document.getElementById('ok').textContent = '';
            if (eros.value === '' || v < 0 || v > 10) { eros.classList.add('hibas'); return; }
            eros.classList.remove('hibas');
            document.getElementById('ok').textContent = 'Mentve!';
        });
    </script>
</body>

</html>
