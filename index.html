<!doctype html>
<html lang="hu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tünetnapló</title>
    <style>
        body {
            font: 15px system-ui, sans-serif;
            background: #fff;
            color: #222;
            max-width: 560px;
            margin: auto;
            padding: 16px;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        legend,
        label[for] {
            font-size: 1.17em;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            margin-top: 16px;
        }

        legend {
            margin-top: 0;
        }

        .chk-label {
            display: inline-block;
            margin: 4px;
            cursor: pointer;
            font-weight: normal;
            margin-top: 0;
        }

        .chk-label input {
            position: absolute;
            opacity: 0;
        }

        .chk-text {
            display: inline-block;
            padding: 8px 12px;
            border: 1px solid #767676;
            border-radius: 16px;
        }

        .chk-label input:checked+.chk-text {
            background: #0e7c66;
            color: #fff;
        }

        .chk-label input:focus-visible+.chk-text {
            outline: 2px solid #222;
            outline-offset: 2px;
        }

        input[type="number"],
        textarea {
            display: block;
            width: 100%;
            padding: 8px;
            font: inherit;
            border: 1px solid #767676;
            box-sizing: border-box;
        }

        .hibas {
            border: 2px solid #d32f2f;
        }

        .hiba-uzenet {
            color: #d32f2f;
            font-weight: bold;
            margin-top: 4px;
            font-size: 0.9em;
            min-height: 1.5em;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            background: #0e7c66;
            color: #fff;
            padding: 10px 16px;
            cursor: pointer;
            border: none;
            font: inherit;
        }

        #ok {
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Napi tünetnapló</h1>

    <form id="tunet-form">
        <fieldset>
            <legend>Tünetek</legend>
            <label class="chk-label">
                <input type="checkbox" name="tunet" value="fejfajas">
                <span class="chk-text">Fejfájás</span>
            </label>
            <label class="chk-label">
                <input type="checkbox" name="tunet" value="hanyinger">
                <span class="chk-text">Hányinger</span>
            </label>
            <label class="chk-label">
                <input type="checkbox" name="tunet" value="szedules">
                <span class="chk-text">Szédülés</span>
            </label>
        </fieldset>

        <label for="eros">Erősség (0–10)</label>
        <input id="eros" type="number" min="0" max="10">
        <div id="eros-hiba" class="hiba-uzenet"></div>

        <label for="megj">Megjegyzés</label>
        <textarea id="megj"></textarea>

        <button type="submit" class="btn">Mentés</button>
    </form>

    <p id="ok"></p>

    <script>
        document.getElementById('tunet-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var eros = document.getElementById('eros');
            var hibaSzoveg = document.getElementById('eros-hiba');
            var v = Number(eros.value);

            document.getElementById('ok').textContent = '';

            if (eros.value === '' || v < 0 || v > 10) {
                eros.classList.add('hibas');
                eros.setAttribute('aria-invalid', 'true');
                eros.setAttribute('aria-describedby', 'eros-hiba');
                hibaSzoveg.textContent = '❌ Hiba: Kérem, adjon meg egy értéket 0 és 10 között!';
                eros.focus();
                return;
            }

            eros.classList.remove('hibas');
            eros.removeAttribute('aria-invalid');
            eros.removeAttribute('aria-describedby');
            hibaSzoveg.textContent = '';

            document.getElementById('ok').textContent = 'Mentve!';
        });
    </script>
</body>

</html>
